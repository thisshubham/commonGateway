spring.application.name=CommonGateway
server.port=30012

spring.datasource.url=jdbc:mysql://localhost:3306/CommonGateway?allowPublicKeyRetrieval=true&useSSL=false&autoreconnect=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

spring.liquibase.enabled=true
spring.liquibase.contexts=prod-validate
spring.liquibase.change-log=db/changelog/db.changelog-master.xml

# Eureka Client config
eureka.client.service-url.defaultZone=http://localhost:1010
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
